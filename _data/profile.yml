short_bio: >-
  <p>
    I am a 3rd year Math and Robotics student at CMU, working with the
    <a href="https://rislab.org/" target="_blank">Resilient Intelligent Systems Lab</a>
    part of 
    CMU's Robotics Institute.
  </p>
  <p>
    My current research focus is on adapting Model Based RL methods for long horizon navigation
    tasks, specifically more principled gradient methods within differentiable simulators.
  </p>
  <p>
    Most recently I have interned for Kodiak AI and Stereolabs, working on train time sample mining, multimodal 
    perception, and multitask learning. 
  </p>

